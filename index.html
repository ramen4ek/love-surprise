<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Для тебя ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#59223f,#190f20 75%);color:#fff0f5;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}main{text-align:center;padding:30px;z-index:1}h1{font-size:clamp(32px,9vw,64px);margin:0 0 24px}button{border:0;cursor:pointer;color:inherit;background:none;touch-action:none}#gift{font-size:110px;filter:drop-shadow(0 0 30px #ff477e88);animation:pulse 1.8s infinite}#love{font-size:36px;opacity:0;transform:translateY(15px);transition:.7s}#love.show{opacity:1;transform:none}#run{position:fixed;left:50%;top:80%;transform:translate(-50%,-50%);font-size:42px;z-index:3}#hint{font-size:14px;color:#ffc2d5}.particle{position:fixed;pointer-events:none;z-index:5;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.2);opacity:0}}@keyframes pulse{50%{transform:scale(1.12)}}</style></head><body><main><h1>На, держи</h1><button id="gift" aria-label="Открыть сюрприз">💝</button><div id="love">Люблю тебя ❤️</div><p id="hint">Нажми на сердечко</p></main><button id="run" hidden aria-label="Поймай сердечко">💗</button><script>const gift=document.querySelector('#gift'),love=document.querySelector('#love'),run=document.querySelector('#run'),hint=document.querySelector('#hint');let last=0,count=0,done=false;function burst(x,y,n=12){for(let i=0;i<n;i++){let p=document.createElement('span');p.className='particle';p.textContent=['❤️','💗','💕','💖'][Math.random()*4|0];p.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+(14+Math.random()*24)+'px;--x:'+((Math.random()-.5)*240)+'px;--y:'+(-40-Math.random()*220)+'px;--r:'+((Math.random()-.5)*100)+'deg';document.body.append(p);setTimeout(()=>p.remove(),1250)}}document.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));document.addEventListener('pointermove',e=>{if(performance.now()-last>65){last=performance.now();burst(e.clientX,e.clientY,1)}});gift.addEventListener('click',()=>{love.classList.add('show');if(!done){run.hidden=false;hint.textContent='А теперь поймай сердечко!'}burst(innerWidth/2,innerHeight/2,45)});function move(e){if(count>=5)return;count++;burst(e.clientX,e.clientY,8);run.style.left=(40+Math.random()*Math.max(0,innerWidth-80))+'px';run.style.top=(65+Math.random()*Math.max(0,innerHeight-130))+'px'}run.addEventListener('pointerdown',e=>{e.preventDefault();if(count<5)move(e);else{done=true;run.hidden=true;hint.textContent='Поймала! Это сердечко твоё ❤️';burst(innerWidth/2,innerHeight/2,65)}});run.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&count<5)move(e)});</script></body></html>
