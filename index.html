<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9dce3"><title>Для тебя ♡</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#fff7f4,#f9dce3);font-family:Georgia,serif;color:#96394d;text-align:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}main{position:relative;z-index:2;width:min(90%,420px);padding:24px}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#open{border:0;background:none;width:100%;padding:0}h1{font-size:27px;font-weight:normal;margin:0 0 25px}p{font-size:19px;line-height:1.55}small{display:block;margin-top:20px;font-size:16px}#reveal[hidden]{display:none}#reveal{animation:appear .8s both}#kiss{border:1px solid #d58e9f;background:#fff5f4;border-radius:30px;padding:13px 25px;font-size:17px}#kiss:active{transform:scale(.95)}.heart{position:fixed;left:50%;top:50%;pointer-events:none;z-index:3;animation:fly var(--duration) var(--delay) both}.float{position:fixed;bottom:-40px;pointer-events:none;opacity:0;animation:float 9s linear infinite;z-index:1}@keyframes fly{0%{transform:translate(0,0) scale(.3);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--rot));opacity:0}}@keyframes appear{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes pop{from{opacity:0;scale:0}to{opacity:1;scale:1}}@keyframes float{15%{opacity:.35}85%{opacity:.35}100%{transform:translate(30px,-115vh);opacity:0}}@media(prefers-reduced-motion:reduce){.float,.heart{display:none}#reveal{animation:none}}#runner{position:fixed;z-index:5;width:58px;height:64px;padding:0;border:0;background:none;transition:left .22s ease-out,top .22s ease-out;touch-action:none}#runner svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px #96394d33)}#runner .legs{animation:runlegs .22s infinite alternate;transform-origin:30px 44px}@keyframes runlegs{to{transform:scaleX(-1)}}#caught{position:fixed;z-index:6;bottom:8%;left:50%;transform:translateX(-50%);background:#fff5f4;border:1px solid #d58e9f;border-radius:24px;padding:12px 20px;white-space:nowrap;box-shadow:0 4px 20px #96394d22;pointer-events:none}@media(prefers-reduced-motion:reduce){#runner{transition:none}#runner .legs{animation:none}}</style></head><body><main><button id="open" aria-label="Открыть письмо"><h1>На, держи</h1><svg width="190" height="140" viewBox="0 0 150 110" aria-hidden="true"><rect x="3" y="3" width="144" height="104" rx="7" fill="#fff4e9" stroke="#cc8a8e" stroke-width="2"/><path d="M4 105L75 48L146 105" fill="#f9d8d5" stroke="#cc8a8e"/><path d="M4 4L75 65L146 4" fill="#ffe6de" stroke="#cc8a8e"/><path d="M75 73C40 53 64 35 75 49C86 35 110 53 75 73" fill="#c84560"/></svg><small>Нажми, чтобы открыть ♡</small></button><section id="reveal" hidden><svg width="210" height="205" viewBox="0 0 170 165" aria-hidden="true"><g stroke="#628c5d" stroke-width="6" fill="none"><path d="M85 147L40 49M85 147L85 32M85 147L130 55M85 147L58 80M85 147L111 82"/></g><g fill="#78a56c"><path d="M66 110Q27 115 32 84Q63 85 66 110"/><path d="M99 112Q138 115 137 87Q108 88 99 112"/></g><g id="flowers"></g><path d="M49 106L85 120L120 106L104 158L67 158Z" fill="#e8b5a5" stroke="#c98f83"/><path d="M64 132L106 132" stroke="#b5445a" stroke-width="6"/><path d="M85 133Q54 109 58 130Q60 145 85 133Q116 109 112 130Q110 145 85 133" fill="#ce5368"/></svg><h1 style="font-weight:bold;margin:15px 0">Люблю тебя!</h1><p>Цветы, которые никогда не завянут, для моей самой любимой девочки.</p><button id="kiss">Ещё раз ♡</button></section></main><button id="runner" hidden aria-label="Поймать сердечко"><svg viewBox="0 0 60 65" aria-hidden="true"><g class="legs" fill="none" stroke="#96394d" stroke-width="3" stroke-linecap="round"><path d="M23 43L18 54L10 54M36 43L42 52L49 50"/></g><path d="M30 46C24 41 3 28 4 16C5 2 22 0 30 13C38 0 55 2 56 16C57 28 36 41 30 46Z" fill="#d94b6c"/><circle cx="22" cy="22" r="2.4" fill="#713047"/><circle cx="38" cy="22" r="2.4" fill="#713047"/><path d="M26 29Q30 34 34 29" fill="none" stroke="#713047" stroke-width="1.8" stroke-linecap="round"/></svg></button><div id="caught" role="status" hidden>Поймала моё сердце ♡</div><script>const colors=['#d93e64','#f092a8','#b92e50','#e86588'];function burst(x=innerWidth/2,y=innerHeight/2,count=48,small=false){for(let i=0;i<count;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%3===1?'♡':'♥';h.style.cssText=`left:${x}px;top:${y}px;color:${colors[i%4]};font-size:${12+Math.random()*24}px;--dx:${(Math.random()-.5)*(small?150:innerWidth*1.6)}px;--dy:${(Math.random()-.65)*(small?180:innerHeight*1.2)}px;--rot:${Math.random()*150-75}deg;--duration:${1.2+Math.random()*1.8}s;--delay:${Math.random()*.6}s`;document.body.append(h);setTimeout(()=>h.remove(),3800)}if(!small&&navigator.vibrate)navigator.vibrate(35)}document.getElementById('open').onclick=()=>{document.getElementById('open').hidden=true;document.getElementById('reveal').hidden=false;document.getElementById('flowers').innerHTML=[[40,49,'#e46785'],[85,32,'#ce3c61'],[130,55,'#ed94a7'],[58,80,'#f5a8b6'],[111,82,'#d94b6c']].map(([x,y,c],i)=>`<g style="transform-origin:${x}px ${y}px;animation:pop .5s ${i*.15}s both"><rect x="${x-10}" y="${y-23}" width="20" height="46" rx="4" fill="${c}"/><rect x="${x-23}" y="${y-10}" width="46" height="20" rx="4" fill="${c}"/><rect x="${x-12}" y="${y-12}" width="24" height="24" rx="5" fill="${c}" stroke="#ffffff55"/><circle cx="${x}" cy="${y}" r="6" fill="#f8d59c"/></g>`).join('');burst();for(let i=0;i<12;i++){const h=document.createElement('span');h.className='float';h.textContent='♡';h.style.cssText=`left:${Math.random()*100}%;color:${colors[i%4]};font-size:${15+Math.random()*20}px;animation-delay:${Math.random()*9}s`;document.body.append(h)}};document.getElementById('kiss').onclick=()=>burst();
let last=0,lx=null,ly=null;
document.addEventListener('pointerdown',e=>{lx=e.clientX;ly=e.clientY;if(!e.target.closest('button'))burst(lx,ly,12,true)});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&e.buttons===0)return;const now=performance.now();if(now-last<45)return;if(lx!==null&&Math.hypot(e.clientX-lx,e.clientY-ly)<9)return;last=now;lx=e.clientX;ly=e.clientY;const h=document.createElement('span');h.className='heart trail';h.textContent=Math.random()<.3?'♡':'♥';h.style.cssText=`left:${lx}px;top:${ly}px;color:${colors[Math.floor(Math.random()*colors.length)]};font-size:${13+Math.random()*16}px;--dx:${Math.random()*46-23}px;--dy:${-45-Math.random()*65}px;--rot:${Math.random()*70-35}deg;--duration:1.1s;--delay:0s`;document.body.append(h);setTimeout(()=>h.remove(),1200)});
document.addEventListener('pointerup',()=>{lx=null;ly=null});document.addEventListener('pointercancel',()=>{lx=null;ly=null});
const runner=document.getElementById('runner'),caught=document.getElementById('caught');let attempts=0,runTimer;
function placeRunner(x,y){runner.style.left=Math.max(4,Math.min(innerWidth-62,x))+'px';runner.style.top=Math.max(4,Math.min(innerHeight-68,y))+'px'}
function wander(){const r=runner.getBoundingClientRect();placeRunner(r.left<innerWidth/2?innerWidth-66:6,Math.random()*Math.max(0,innerHeight-70));}
document.getElementById('open').addEventListener('click',()=>{setTimeout(()=>{runner.hidden=false;placeRunner(innerWidth-66,innerHeight*.18);runTimer=setInterval(wander,2400)},3000)},{once:true});
runner.addEventListener('click',()=>{if(attempts<3){attempts++;wander();if(attempts===3)clearInterval(runTimer);return}clearInterval(runTimer);const r=runner.getBoundingClientRect();runner.hidden=true;burst(r.left+r.width/2,r.top+r.height/2,65);caught.hidden=false;setTimeout(()=>{caught.hidden=true},4500)});
window.addEventListener('resize',()=>{if(!runner.hidden){const r=runner.getBoundingClientRect();placeRunner(r.left,r.top)}});
</script></body></html>
